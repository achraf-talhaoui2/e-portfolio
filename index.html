languages: [ // [nom, niveau affiché, jauge de 0 à 100]

[{ fr: "Français", en: "French" }, { fr: "Courant", en: "Fluent" }, 90],

[{ fr: "Anglais", en: "English" }, { fr: "Courant", en: "Fluent" }, 85],

[{ fr: "Espagnol", en: "Spanish" }, { fr: "Débutant", en: "Beginner" }, 25]

],

// CHANGÉ : ta vraie mobilité (venir étudier en France) n'apparaissait pas.
// Adapte la phrase si elle ne correspond pas exactement à ton vécu.
mobility: {

fr: "Originaire du Maroc, j’ai quitté mon pays pour poursuivre mes études d’ingénieur à Toulouse, en France. Cette expérience m’a appris à m’adapter à un nouvel environnement académique et culturel et à travailler en autonomie. J’ai également visité l’Espagne.",

},

// A COMPLETER : ces deux textes entre crochets sont visibles sur ton site actuel.
// Remplace-les par un vrai engagement (association de l'ENSEEIHT, bénévolat, club sportif, tutorat...)
// avec : ton rôle, depuis quand, ce que ça t'apporte. Tu peux ajouter plusieurs blocs { title, text }.
engagement: [

/* ===================== FIN DE LA ZONE À MODIFIER ===================== */
const UI = {
fr: { hello:"Portfolio de", nav:["Accueil","Ingénierie","Parcours","Mobilité","Engagement","Activités","Contact"],
eng:"Ingénierie", engSub:"Compétences techniques et projets réalisés. Cliquez sur un projet pour en voir le détail.", radar:"Profil de compétences", projects:"Projets", all:"Tous",
career:"Parcours", careerSub:"Formation, stage et documents. Cliquez sur une étape pour la déplier.", mob:"Mobilité internationale", mobSub:"Langues parlées et pays visités.",
eng2:"Engagement", eng2Sub:"Vie associative et citoyenne.", act:"Activités", actSub:"Centres d’intérêt en dehors des études.",
contact:"Contact", contactSub:"Un stage, un projet, une question : n’hésitez pas à me contacter.", send:"Envoyer par e-mail", fName:"Nom", fMail:"Adresse e-mail", fMsg:"Message",
cv:"Télécharger mon CV", seeProj:"Voir mes projets", close:"Fermer", dark:"Mode sombre", light:"Mode clair", rights:"Tous droits réservés." },
en: { hello:"Portfolio of", nav:["Home","Engineering","Career","Mobility","Engagement","Activities","Contact"],
eng:"Engineering", engSub:"Technical skills and completed projects. Click a project for details.", radar:"Skills profile", projects:"Projects", all:"All",
career:"Career", careerSub:"Education, internship and documents. Click a step to expand it.", mob:"International mobility", mobSub:"Languages spoken and countries visited.",
eng2:"Engagement", eng2Sub:"Community and civic involvement.", act:"Activities", actSub:"Interests outside of my studies.",
contact:"Contact", contactSub:"An internship, a project, a question: feel free to get in touch.", send:"Send by e-mail", fName:"Name", fMail:"E-mail address", fMsg:"Message",
cv:"Download my CV", seeProj:"See my projects", close:"Close", dark:"Dark mode", light:"Light mode", rights:"All rights reserved." }
};
const IDS = ["hero","engineering","career","mobility","engagement","activities","contact"];
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const store = { get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}} };
let lang = store.get("lang") || ((navigator.language||"fr").slice(0,2) === "en" ? "en" : "fr");
let theme = store.get("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
let tagFilter = "all", typeTimer;
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const L = o => (o && typeof o === "object" && !Array.isArray(o)) ? (o[lang] || o.fr) : o;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ini = n => n.split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function render(){
const u = UI[lang];
document.documentElement.lang = lang; document.documentElement.dataset.theme = theme;
document.title = P.name + " – Portfolio";
$$("[data-s]").forEach(e => e.textContent = u[e.dataset.s]);
$$("[data-ph]").forEach(e => e.placeholder = u[e.dataset.ph]);
$("#nav").innerHTML = `<strong style="font-family:'Source Serif 4';font-size:1.2rem;margin-right:.8rem">${esc(ini(P.name))}</strong>` +
IDS.map((id,i)=>`<a class="l" href="#${id}" data-id="${id}">${u.nav[i]}</a>`).join("") +
`<span class="sp"></span><button id="bt">${theme==="dark"?u.light:u.dark}</button><button id="bl" style="margin-left:.4rem">${lang==="fr"?"EN":"FR"}</button>`;
$("#hello").textContent = u.hello; $("#hname").textContent = P.name; $("#tag").textContent = L(P.tagline);
$("#photo").innerHTML = P.photo ? `<img src="${esc(P.photo)}" alt="${esc(P.name)}" onerror="this.parentNode.textContent='${esc(ini(P.name))}'">` : esc(ini(P.name));
$("#stats").innerHTML = P.stats.map(([n,l])=>`<div class="stat"><b data-n="${n}">0</b><span>${esc(L(l))}</span></div>`).join("");
$("#cta").innerHTML = `<a class="btn" href="${esc(P.cv[lang])}" download>${u.cv}</a><a class="btn alt" href="#engineering">${u.seeProj}</a>`;
$("#cvs").innerHTML = `<a class="btn" href="${esc(P.cv.fr)}" download>CV (FR)</a><a class="btn alt" href="${esc(P.cv.en)}" download>CV (EN)</a><a class="btn alt" href="${esc(P.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>`;
$("#skills").innerHTML = Object.entries(P.skills).map(([g,a])=>`<h4 style="margin:.8rem 0 .5rem">${esc(g)}</h4>` + (a.every(x=>x[1]==null) ? `<div class="chips">${a.map(([n])=>`<span class="chip" style="font-size:.9rem;padding:.25rem .8rem">${esc(n)}</span>`).join("")}</div>` : a.map(([n,v])=>v==null?`<div class="chips"><span class="chip">${esc(n)}</span></div>`:`<div class="sk"><div><span>${esc(n)}</span><span>${v}%</span></div><div class="trk"><i data-w="${v}"></i></div></div>`).join(""))).join("");
const rc = $("#radar").closest(".card"); rc.hidden = !P.radar.length; $(".two").style.gridTemplateColumns = P.radar.length ? "" : "1fr"; if (P.radar.length) drawRadar();
const tags = ["all", ...new Set(P.projects.map(p=>p.tag))];
$("#filters").innerHTML = tags.map(t=>`<button class="chip ${t===tagFilter?"on":""}" data-t="${esc(t)}">${t==="all"?u.all:esc(t)}</button>`).join("");
$("#filters").hidden = tags.length <= 2; $("#projects").classList.toggle("solo", P.projects.length === 1);
drawProjects();
$("#tl").innerHTML = P.career.map(c=>`<div class="ev" tabindex="0" role="button"><small>${esc(c.date)} · ${esc(c.org)}, ${esc(c.place)}</small><h4>${esc(L(c.role))}</h4><p>${esc(L(c.desc))}</p></div>`).join("");
$("#langs").innerHTML = P.languages.map(([n,lv,p])=>`<div class="card"><div class="lv"><span>${esc(L(n))}</span><b>${esc(L(lv))}</b></div><div class="trk"><i data-w="${p}"></i></div></div>`).join("");
$("#mobTxt").textContent = L(P.mobility); $("#pins").innerHTML = P.destinations.map(d=>`<span class="pin">${esc(L(d))}</span>`).join("");
$("#eng").innerHTML = P.engagement.map(e=>`<div class="card"><h4>${esc(L(e.title))}</h4><p style="color:var(--mute);margin-top:.6rem">${esc(L(e.text))}</p></div>`).join("");
$("#acts").innerHTML = P.activities.map(a=>`<div class="card act"><div class="aimg">${a.img?`<img src="${esc(a.img)}" alt="${esc(L(a.title))}" onerror="this.parentNode.textContent='${esc(ini(L(a.title)))}'">`:esc(ini(L(a.title)))}</div><div class="pb"><h4>${esc(L(a.title))}</h4><p style="margin-bottom:0">${esc(L(a.text))}</p></div></div>`).join("");
$("#links").innerHTML = [[P.email,"mailto:"+P.email],["LinkedIn",P.linkedin],["GitHub",P.github]].map(([t,h])=>`<a class="btn alt" href="${esc(h)}" target="_blank" rel="noopener">${esc(t)}</a>`).join("");
$("#foot").textContent = `© ${new Date().getFullYear()} ${P.name}. ${u.rights}`;
startType(); watch();
}
function drawRadar(){
const n = P.radar.length, R = 90, ln = cssv("--line"), pt = (i,v) => { const a = -Math.PI/2 + i*2*Math.PI/n; return [Math.cos(a)*R*v/100, Math.sin(a)*R*v/100]; };
const poly = v => P.radar.map((_,i)=>pt(i,v).join(",")).join(" "), acc = cssv("--acc");
$("#radar").innerHTML = [25,50,75,100].map(v=>`<polygon points="${poly(v)}" fill="none" stroke="${ln}"/>`).join("") +
P.radar.map((_,i)=>`<line x2="${pt(i,100)[0]}" y2="${pt(i,100)[1]}" stroke="${ln}"/>`).join("") +
`<polygon points="${P.radar.map(([,v],i)=>pt(i,v).join(",")).join(" ")}" fill="${acc}" fill-opacity=".2" stroke="${acc}" stroke-width="2"/>` +
P.radar.map(([t,v],i)=>{ const [x,y] = pt(i,v), [lx,ly] = pt(i,124); return `<circle cx="${x}" cy="${y}" r="3.5" fill="${acc}"/><text x="${lx}" y="${ly}" fill="${cssv("--mute")}" font-size="10" text-anchor="middle" dominant-baseline="middle">${esc(t)}</text>`; }).join("");
}
function drawProjects(){
$("#projects").innerHTML = P.projects.map((p,i)=>({p,i})).filter(({p})=>tagFilter==="all"||p.tag===tagFilter).map(({p,i})=>
`<button class="card proj" data-p="${i}"><div class="pimg">${p.img?`<img src="${esc(p.img)}" alt="" onerror="this.parentNode.textContent='${esc(ini(L(p.title)))}'">`:esc(ini(L(p.title)))}</div><div class="pb"><h4>${esc(L(p.title))}</h4><p>${esc(L(p.desc))}</p><div class="chips">${p.stack.map(s=>`<span class="chip">${esc(s)}</span>`).join("")}</div></div></button>`).join("");
}
function startType(){
clearInterval(typeTimer); const r = P.roles[lang], el = $("#type"); let i = 0, j = 0, del = false;
if (RM) { el.textContent = r[0]; return; }
typeTimer = setInterval(()=>{
const w = r[i]; j += del ? -1 : 1; el.textContent = w.slice(0, Math.max(j,0));
if (!del && j === w.length) { del = true; j = w.length + 16; }
else if (del && j <= 0) { del = false; i = (i + 1) % r.length; j = 0; }
}, 65);
}
let io;
function watch(){
if (io) io.disconnect();
io = new IntersectionObserver(es => es.forEach(e => {
if (!e.isIntersecting) return; io.unobserve(e.target);
e.target.querySelectorAll("[data-w]").forEach(b => b.style.width = b.dataset.w + "%");
e.target.querySelectorAll("[data-n]").forEach(b => count(b, +b.dataset.n));
}), { threshold:.25 });
$$("#skills,#stats,#langs").forEach(c => io.observe(c));
}
function count(el, to){ if (RM) { el.textContent = to; return; } let t0; const f = t => { t0 ??= t; const k = Math.min((t-t0)/1000,1); el.textContent = Math.round(to*(1-Math.pow(1-k,3))); if (k<1) requestAnimationFrame(f); }; requestAnimationFrame(f); }
document.addEventListener("click", e => {
const t = e.target.closest("button,.ev"); if (!t) return;
if (t.id === "bt") { theme = theme==="dark"?"light":"dark"; store.set("theme", theme); render(); }
else if (t.id === "bl") { lang = lang==="fr"?"en":"fr"; store.set("lang", lang); render(); }
else if (t.dataset.t) { tagFilter = t.dataset.t; $$("#filters .chip").forEach(c => c.classList.toggle("on", c.dataset.t === tagFilter)); drawProjects(); }
else if (t.dataset.p) openProj(P.projects[t.dataset.p]);
else if (t.classList.contains("ev")) t.classList.toggle("open");
});
document.addEventListener("keydown", e => { if (e.key==="Enter" && e.target.classList.contains("ev")) e.target.classList.toggle("open"); });
function openProj(p){
const pts = p.points ? `<ul style="margin:1rem 0;padding-left:1.2rem;color:var(--mute)">${L(p.points).map(x=>`<li style="margin-bottom:.35rem">${esc(x)}</li>`).join("")}</ul>` : "";
$("#mod").innerHTML = `${p.img?`<img src="${esc(p.img)}" alt="" style="width:100%;border-radius:10px;margin-bottom:1rem">`:""}<h3>${esc(L(p.title))}</h3><p>${esc(L(p.desc))}</p>${pts}<div class="chips">${p.stack.map(s=>`<span class="chip">${esc(s)}</span>`).join("")}</div><div class="cta">${p.links.map(([t,h])=>`<a class="btn" target="_blank" rel="noopener" href="${esc(h)}">${esc(t)}</a>`).join("")}<button onclick="this.closest('dialog').close()">${UI[lang].close}</button></div>`;
$("#mod").showModal();
}
$("#mod").addEventListener("click", e => { if (e.target.id === "mod") e.target.close(); });
$("#form").addEventListener("submit", e => {
e.preventDefault(); const f = new FormData(e.target);
location.href = `mailto:${P.email}?subject=${encodeURIComponent("Portfolio – "+f.get("n"))}&body=${encodeURIComponent(f.get("m")+"\n\n"+f.get("n")+" <"+f.get("e")+">")}`;
});
addEventListener("scroll", () => {
const h = document.documentElement; $("#bar").style.width = (h.scrollTop / (h.scrollHeight - h.clientHeight) * 100) + "%";
let cur = IDS[0]; IDS.forEach(id => { if ($("#"+id).getBoundingClientRect().top < innerHeight*.4) cur = id; });
$$("nav a.l").forEach(a => a.classList.toggle("on", a.dataset.id === cur));
}, { passive:true });
render(); dispatchEvent(new Event("scroll"));
</script>
