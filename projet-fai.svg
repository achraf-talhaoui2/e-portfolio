<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Schéma du FAI simplifié</title>
  <desc id="d">Réseaux clients derrière une BOX, deux routeurs du FAI en redondance avec le routage RIP, et une DMZ avec un serveur Web et un serveur DNS.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d5afe"/>
      <stop offset="1" stop-color="#12b5a6"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.92" cy="0.08" r="0.55">
      <stop offset="0" stop-color="#ff8a5b" stop-opacity=".5"/>
      <stop offset="1" stop-color="#ff8a5b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="0.05" cy="0.98" r="0.5">
      <stop offset="0" stop-color="#12b5a6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#12b5a6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#fff" opacity=".18"/>
    </pattern>
    <style>
      text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
      .zone{fill:#fff;fill-opacity:.09;stroke:#fff;stroke-opacity:.6;stroke-width:2;stroke-dasharray:8 7}
      .zl{fill:#fff;font-size:18px;font-weight:700;letter-spacing:2px;opacity:.95}
      .ln{stroke:#fff;stroke-width:3.5;stroke-linecap:round;fill:none;opacity:.92}
      .bk{stroke-dasharray:3 9}
      .dev{fill:#fff}
      .tx{fill:#18203a;font-weight:700;text-anchor:middle}
      @media (prefers-reduced-motion: reduce){.pk{display:none}}
    </style>
  </defs>

  <!-- Fond -->
  <rect width="800" height="400" fill="url(#bg)"/>
  <rect width="800" height="400" fill="url(#warm)"/>
  <rect width="800" height="400" fill="url(#cool)"/>
  <rect width="800" height="400" fill="url(#dots)"/>

  <!-- Zones -->
  <rect class="zone" x="40" y="85" width="180" height="230" rx="18"/>
  <rect class="zone" x="270" y="85" width="270" height="230" rx="18"/>
  <rect class="zone" x="590" y="85" width="170" height="230" rx="18"/>
  <text class="zl" x="58" y="114">LAN</text>
  <text class="zl" x="288" y="114">FAI / ISP</text>
  <text class="zl" x="608" y="114">DMZ</text>

  <!-- Liens -->
  <path class="ln" d="M104 165 L146 212"/>
  <path class="ln" d="M104 255 L146 228"/>
  <path class="ln" d="M206 220 L405 172"/>
  <path class="ln bk" d="M206 220 L405 268"/>
  <path class="ln" d="M405 172 L405 268"/>
  <path class="ln" d="M405 172 L605 214"/>
  <path class="ln" d="M405 268 L605 226"/>
  <path class="ln" d="M645 214 L672 176"/>
  <path class="ln" d="M645 226 L672 264"/>

  <!-- Paquets animés (masqués si l'utilisateur réduit les animations) -->
  <g class="pk">
    <circle r="6" fill="#ff8a5b" stroke="#fff" stroke-width="2">
      <animateMotion dur="4.5s" repeatCount="indefinite" path="M176 220 L405 172 L625 220 L709 170"/>
    </circle>
    <circle r="6" fill="#ffd8c7" stroke="#fff" stroke-width="2">
      <animateMotion dur="4.5s" begin="2.2s" repeatCount="indefinite" path="M709 270 L625 220 L405 268 L176 220"/>
    </circle>
  </g>

  <!-- LAN : deux postes et la BOX -->
  <g>
    <rect class="dev" x="60" y="150" width="44" height="30" rx="5"/>
    <rect x="64" y="154" width="36" height="22" rx="3" fill="#3d5afe"/>
    <rect class="dev" x="77" y="180" width="10" height="6"/>
    <rect class="dev" x="71" y="186" width="22" height="3" rx="1.5"/>

    <rect class="dev" x="60" y="240" width="44" height="30" rx="5"/>
    <rect x="64" y="244" width="36" height="22" rx="3" fill="#3d5afe"/>
    <rect class="dev" x="77" y="270" width="10" height="6"/>
    <rect class="dev" x="71" y="276" width="22" height="3" rx="1.5"/>

    <rect class="dev" x="146" y="200" width="60" height="40" rx="10"/>
    <text class="tx" x="176" y="226" font-size="17">BOX</text>
  </g>

  <!-- FAI : deux routeurs en redondance, routage RIP -->
  <g>
    <circle class="dev" cx="405" cy="172" r="26"/>
    <text class="tx" x="405" y="178" font-size="17">R1</text>
    <circle class="dev" cx="405" cy="268" r="26"/>
    <text class="tx" x="405" y="274" font-size="17">R2</text>
    <rect x="383" y="208" width="44" height="24" rx="12" fill="#ff8a5b" stroke="#fff" stroke-width="2"/>
    <text x="405" y="225" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">RIP</text>
  </g>

  <!-- DMZ : commutateur, serveur Web, serveur DNS -->
  <g>
    <rect class="dev" x="605" y="206" width="40" height="28" rx="6"/>
    <text class="tx" x="625" y="225" font-size="13">SW</text>

    <rect class="dev" x="672" y="150" width="74" height="40" rx="8"/>
    <circle cx="685" cy="162" r="3.5" fill="#12b5a6"/>
    <text class="tx" x="715" y="176" font-size="16">Web</text>

    <rect class="dev" x="672" y="250" width="74" height="40" rx="8"/>
    <circle cx="685" cy="262" r="3.5" fill="#12b5a6"/>
    <text class="tx" x="715" y="276" font-size="16">DNS</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
